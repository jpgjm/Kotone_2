name: build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      # -----------------------------------------------------------------------
      # タイムスタンプを一度だけ計算して全ステップで共有する（ドリフト防止）
      # -----------------------------------------------------------------------
      - name: Compute JST timestamp
        run: |
          echo "STAMP=$(TZ=Asia/Tokyo date +'%Y-%m-%dT%H-%M-%S%z' | sed 's/\(+[0-9]\{2\}\)\([0-9]\{2\}\)$/\1-\2/')" >> "$GITHUB_ENV"


      # -----------------------------------------------------------------------
      # Xcode の選択
      #
      # WKWebExtension（iOS 18.4）と ViviMusic の SwiftUI（iOS 17）を使うので
      # SDK 26 世代でビルドする。利用可能な最新の Xcode 26.x 以降を選ぶ。
      # 「選べたら選ぶ」であって必須要件ではないので、このステップはビルドを止めない。
      #
      # 注意点 3 つ:
      #   * xcodebuild を起動しない。
      #     ランナー上の一部の Xcode で xcodebuild -version が SIGABRT(134) する。
      #     set -e 下で ver="$(...)" すると代入文がその終了コードを継承して
      #     ステップごと死ぬ。version.plist を読むだけならプロセスを起動しない。
      #   * sort -V を使わない。macOS の BSD sort は対応が不確実。
      #     awk でゼロ埋め数値に変換して比較する。
      #   * sudo xcode-select ではなく DEVELOPER_DIR を GITHUB_ENV に書く。
      # -----------------------------------------------------------------------
      - name: Select Xcode
        continue-on-error: true
        run: |
          set -uo pipefail

          vnum() {
            printf '%s' "$1" | awk -F. '{
              printf "%03d%03d%03d", ($1==""?0:$1), ($2==""?0:$2), ($3==""?0:$3)
            }'
          }

          BEST=""
          BEST_VER=""
          BEST_NUM=0

          echo "--- available Xcode ---"
          for app in /Applications/Xcode*.app; do
            [ -d "$app" ] || continue
            plist="$app/Contents/version.plist"
            ver=""
            if [ -f "$plist" ]; then
              ver="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$plist" 2>/dev/null)" || ver=""
            fi
            if [ -z "$ver" ]; then
              printf '  %-28s %s\n' "$(basename "$app")" "(version.plist 読み取り不可)"
              continue
            fi
            printf '  %-28s %s\n' "$(basename "$app")" "$ver"

            case "$ver" in
              26.*|2[7-9].*|3[0-9].*) ;;
              *) continue ;;
            esac

            num="$(vnum "$ver")"
            if [ "$num" -gt "$BEST_NUM" ] 2>/dev/null; then
              BEST="$app"; BEST_VER="$ver"; BEST_NUM="$num"
            fi
          done

          echo "--- selected ---"
          if [ -n "$BEST" ] && [ -d "$BEST/Contents/Developer" ]; then
            echo "DEVELOPER_DIR=$BEST/Contents/Developer" >> "$GITHUB_ENV"
            echo "Xcode $BEST_VER  ($BEST)"
          else
            echo "::warning::Xcode 26.x が見つかりませんでした。既定のツールチェーンで続行します。"
            echo "既定: $(xcode-select -p 2>/dev/null || echo unknown)"
          fi
          exit 0

      - name: Record toolchain
        continue-on-error: true
        run: |
          set -uo pipefail
          {
            echo "### Toolchain"
            echo '```'
            echo "DEVELOPER_DIR = ${DEVELOPER_DIR:-(unset; xcode-select の既定)}"
            xcodebuild -version 2>&1 | head -2 || echo "(xcodebuild -version 失敗)"
            echo
            xcodebuild -showsdks 2>/dev/null | grep -i iphoneos || echo "(SDK 一覧取得不可)"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"
          exit 0

      # Swift コンパイラの前に、独自シンボルの相互参照だけ先に検査する。
      # macOS ランナーを 10 分使ってから
      #   error: value of type 'X' has no member 'Y'
      # で落ちるのを避けるため。
      # 行単位の編集で波括弧の対応が壊れていないかを先に見る。
      # rev.36 は Views の 1 行を削除した結果、対応する閉じ括弧が浮いて
      #   error: extraneous '}' at top level
      # で落ちた。Swift コンパイラを待たずに検出できる。
      - name: Check brace balance
        run: |
          chmod +x scripts/check-braces.sh
          ./scripts/check-braces.sh

      - name: Check own symbols
        run: |
          chmod +x scripts/check-symbols.sh scripts/check_swift_symbols.py
          ./scripts/check-symbols.sh

      # 拡張機能（Kotone Bridge）の manifest と JS の構文。
      # Xcode はこれらを検査しないので、壊れていても実機で読み込むまで分からない。
      - name: Check extension
        run: |
          set -e
          python3 -c "import json; json.load(open('Extension/manifest.json')); print('manifest.json ok')"
          for f in Extension/*.js; do node --check "$f"; echo "$f ok"; done
          # やり取りの形の確認（jsdom。リポジトリの外に入れてスナップショットに混ぜない）
          npm i --silent --prefix "$RUNNER_TEMP/jst" jsdom@24
          NODE_PATH="$RUNNER_TEMP/jst/node_modules" node scripts/test-extension.js Extension

      - name: Install XcodeGen
        run: brew install xcodegen

      # -----------------------------------------------------------------------
      # .xcodeproj / build/ の混入を防ぐため、生成前にスナップショットを取る
      # -----------------------------------------------------------------------
      - name: Snapshot sources
        run: |
          mkdir -p "$RUNNER_TEMP/snapshot/${{ github.event.repository.name }}"
          rsync -a --exclude '.git' --exclude '*.xcodeproj' --exclude 'build' \
            ./ "$RUNNER_TEMP/snapshot/${{ github.event.repository.name }}/"

      # WebKit は拡張機能の JS を charset なしで返し、日本語が文字化けする（rev.57 実機）。
      # ビルドに入れる直前に ASCII（\uXXXX）へ置き換え、置き換え後の JS でも試験する。
      - name: Escape extension scripts to ASCII
        run: |
          set -e
          python3 scripts/escape-extension-js.py Extension
          python3 scripts/escape-extension-js.py --check Extension
          for f in Extension/*.js; do node --check "$f"; done
          NODE_PATH="$RUNNER_TEMP/jst/node_modules" node scripts/test-extension.js Extension

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project Kotone.xcodeproj \
            -scheme Kotone \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            -destination 'generic/platform=iOS' \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            build 2>&1 | tee "$RUNNER_TEMP/xcodebuild.log"

      # -----------------------------------------------------------------------
      # 未署名 IPA を組み立てる。SideStore 側で署名される前提。
      # -----------------------------------------------------------------------
      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/Kotone.app"
          test -d "$APP" || { echo "::error::app not found"; exit 1; }

          echo "--- bundle sanity checks ---"
          test -x "$APP/Kotone" || { echo "::error::executable missing"; exit 1; }
          test -f "$APP/Info.plist" || { echo "::error::Info.plist missing"; exit 1; }

          # 同梱の拡張機能（Kotone Bridge）
          for f in manifest.json background.js content.js page.js; do
            test -f "$APP/Extension/$f" || { echo "::error::Extension/$f が同梱されていません"; exit 1; }
          done
          echo "extension: OK"

          # LiveContainer はゲストの App Extension を起動できないので、appex を持たないこと
          if [ -d "$APP/PlugIns" ] && ls "$APP/PlugIns" | grep -q '\.appex$'; then
            echo "::error::PlugIns に appex があります: $(ls "$APP/PlugIns")"
            exit 1
          fi
          echo "no app extensions: OK"

          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry "${STAMP}_Kotone-unsigned.ipa" Payload
          rm -rf Payload
          ls -lh "${STAMP}_Kotone-unsigned.ipa"
          du -sh "$APP"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STAMP }}_Kotone-unsigned-ipa
          path: ${{ env.STAMP }}_Kotone-unsigned.ipa
          include-hidden-files: true
          compression-level: 0   # IPA は既に zip

      - name: Upload source snapshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STAMP }}_source-snapshot
          path: ${{ runner.temp }}/snapshot
          include-hidden-files: true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.STAMP }}_xcodebuild-log
          path: ${{ runner.temp }}/xcodebuild.log
